services:
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  mongo:
    image: mongo
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /etc/mongodb/pki
        printf '%s' "$$MONGO_KEYFILE" > /etc/mongodb/pki/keyfile
        chown mongodb:mongodb /etc/mongodb/pki/keyfile
        chmod 400 /etc/mongodb/pki/keyfile
        exec docker-entrypoint.sh "$$@"
      - --
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017", "--keyFile", "/etc/mongodb/pki/keyfile" ]
    ports:
      - 127.0.0.1:27017:27017
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval \"db.runCommand({ ping: 1 }).ok\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD-root}
      - MONGO_KEYFILE=${MONGO_KEYFILE:?Set MONGO_KEYFILE in .env (run 'make keyfile')}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    restart: unless-stopped
  mongo-init:
    image: mongo
    depends_on:
      mongo:
        condition: service_healthy
    restart: no
    entrypoint: >
      bash -c ' mongosh --host mongo --port 27017 -u root -p root --authenticationDatabase admin --eval "
        try {
          rs.status()
        } catch (e) {
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"localhost:27017\" }]
          })
        }
      "'

volumes:
  mongo_data:
  mongo_config:
  mailpit_data:
