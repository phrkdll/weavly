name: Tests

on:
  pull_request:
    branches:
      - "*"

jobs:
  tests:
    runs-on: codeberg-small

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run 'dotnet test'
        run: dotnet test
