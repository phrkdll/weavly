name: Sonar

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: codeberg-medium
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed so SonarCloud can detect PRs & branches

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install tools
        run: |
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet tool install -g dotnet-sonarscanner
          dotnet tool install -g dotnet-coverage

      - name: Begin SonarQube analysis
        run: dotnet-sonarscanner begin /k:"weavly" /d:sonar.host.url=${{ secrets.SONAR_HOST_URL }} /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml

      - name: Build and test solution
        run: |
          dotnet build --no-incremental
          dotnet-coverage collect "dotnet test" -f xml -o "coverage.xml"

      - name: End SonarQube analysis
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"